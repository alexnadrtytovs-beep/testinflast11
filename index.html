<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тестування: Інфекції з трансмісивним механізмом передачі</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f0f2f5;
            color: #1c1e21;
            margin: 0;
            padding: 10px;
            display: flex;
            justify-content: center;
            align-items: center; 
            min-height: 100vh;
        }

        #quiz-container, #result-container {
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 650px;
            min-height: 300px;
            display: flex;
            flex-direction: column;
        }

        #quiz-header { padding: 20px; background-color: #007bff; color: white; border-radius: 12px 12px 0 0; }
        #question-counter { font-size: 0.85em; opacity: 0.9; margin-bottom: 4px; }
        #question-text { font-size: 1.15em; font-weight: 600; line-height: 1.4; }

        #options-container { 
            padding: 20px; 
            display: flex; 
            flex-direction: column; 
            gap: 12px;
            flex-grow: 1;
        }

        .option-item {
            display: flex;
            align-items: center;
            border: 2px solid #e4e6eb;
            border-radius: 10px;
            padding: 14px;
            cursor: pointer;
            transition: all 0.1s ease;
            -webkit-tap-highlight-color: transparent;
        }

        .option-item:active { transform: scale(0.98); background-color: #f0f2f5; }
        .option-item.selected { border-color: #007bff; background-color: #e7f3ff; }
        .option-item.correct { border-color: #28a745; background-color: #d4edda; color: #155724; }
        .option-item.incorrect { border-color: #dc3545; background-color: #f8d7da; color: #721c24; }

        .option-item input { width: 20px; height: 20px; margin-right: 15px; flex-shrink: 0; pointer-events: none; }
        .option-item label { flex-grow: 1; cursor: pointer; font-size: 1em; pointer-events: none; }

        #navigation {
            padding: 15px 20px;
            background-color: #f8f9fa;
            border-top: 1px solid #e4e6eb;
            display: flex;
            justify-content: flex-end;
            border-radius: 0 0 12px 12px;
        }

        .nav-button {
            padding: 12px 24px;
            border-radius: 8px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            background-color: #007bff;
            color: white;
            transition: background-color 0.2s;
        }

        .nav-button:hover { background-color: #0056b3; }
        .nav-button:disabled { background-color: #bcc0c4; cursor: not-allowed; }
        #feedback-container { padding: 10px 20px; text-align: center; font-weight: bold; display: none; }
        .res-correct { color: #28a745; }
        .res-wrong { color: #dc3545; }
        .result-item { padding: 15px; border-bottom: 1px solid #eee; }
        #result-container { display: none; padding: 20px; max-height: 90vh; overflow-y: auto; }
    </style>
</head>
<body>

    <div id="quiz-container">
        <div id="quiz-header">
            <div id="question-counter"></div>
            <div id="question-text"></div>
        </div>
        <div id="options-container"></div>
        <div id="feedback-container"></div>
        <div id="navigation">
            <button class="nav-button" id="main-btn" onclick="handleButtonClick()" disabled>Перевірити</button>
        </div>
    </div>

    <div id="result-container">
        <h2>Результат</h2>
        <div id="score-text"></div>
        <div id="error-review"></div>
        <button class="nav-button" onclick="location.reload()" style="width:100%; margin-top:20px;">Почати знову</button>
    </div>

    <script>
        // ТУТ ЗБЕРІГАЮТЬСЯ ВСІ ПИТАННЯ (Поки що перші 30)
        const quizData = [
         
    { question: "1. Який цикл розвитку малярійного плазмодія відбувається в організмі людини?", options: { a: "шизогонія", b: "спорогонія", c: "спорогонія і шизогонія", d: "гаметогонія" }, correct: ["a"] },
    { question: "2. Який цикл розвитку малярійного плазмодія відбувається в організмі комара?", options: { a: "шизогонія", b: "спорогонія", c: "спорогонія і шизогонія", d: "тканинна шизогонія" }, correct: ["b"] },
    { question: "3. Малярія, що має найбільш важкий перебіг:", options: { a: "триденна", b: "тропічна", c: "овале", d: "чотириденна" }, correct: ["b"] },
    { question: "4. Приступи малярії спостерігаються в різні години доби при:", options: { a: "триденній", b: "овале", c: "тропічній", d: "чотириденній" }, correct: ["c"] },
    { question: "5. Які дослідження використовують для підтвердження діагнозу малярії:", options: { a: "загальний аналіз крові", b: "мазки крові, товста крапля крові", c: "серологічні методи", d: "біологічні методи" }, correct: ["b"] },
    { question: "6. Малярія, при якій в периферійній крові можна знайти всі стадії розвитку малярійного плазмодія:", options: { a: "P.ovale", b: "P.vivax", c: "P.malariae", d: "P.falciparum" }, correct: ["a", "b", "c"] },
    { question: "7. Малярія, при якій в периферійній крові можна знайти тільки кільцевидні трофозоїти і гамети:", options: { a: "P.ovale", b: "P.vivax", c: "P.falciparum", d: "P.malariae" }, correct: ["c"] },
    { question: "8. Малярія, при якій можна досліджувати кров, не дочекавшись пароксизму:", options: { a: "тропічна", b: "овале", c: "триденна", d: "чотириденна" }, correct: ["a"] },
    { question: "9. Малярія, для якої найбільш характерний розвиток ускладнень:", options: { a: "овале", b: "триденна", c: "чотириденна", d: "тропічна" }, correct: ["d"] },
    { question: "10. Ускладнення, не характерне для тропічної малярії:", options: { a: "алгід", b: "малярійна кома", c: "гемоглобінурійна лихоманка", d: "нефротичний синдром", e: "дегідратаційний шок" }, correct: ["e"] },
    { question: "11. Для лікування яких форм малярії призначається делагіл?", options: { a: "триденної", b: "чотириденної", c: "овале", d: "тропічної (з врахуванням резистентності)" }, correct: ["a", "b", "c", "d"] },
    { question: "12. Препарати для лікування малярійної коми:", options: { a: "делагіл внутрішньовенно", b: "делагіл перорально", c: "хінін внутрішньовенно", d: "хінін перорально" }, correct: ["a", "c"] },
    { question: "13. Для патогенетичної терапії внутрішньосудинного гемолізу еритроцитів при малярії доцільно застосовувати:", options: { a: "глюкозу, інсулін, еуфілін", b: "ацесіль", c: "реополіглюкін", d: "преднізолон, гідрокортизон" }, correct: ["d"] },
    { question: "14. Не використовуються для індивідуальної хіміопрофілактики малярії:", options: { a: "делагіл", b: "фансідар", c: "амодіахін", d: "тетрациклін" }, correct: ["d"] },
    { question: "15. Група інфекцій, до якої відносяться рикетсіози:", options: { a: "кишкові", b: "крапельні", c: "особливо небезпечні", d: "трансмісивні" }, correct: ["d"] },
    { question: "16. При висипному тифі:", options: { a: "джерело інфекції - одежна воша", b: "зараження може відбуватись контактно-побутовим шляхом", c: "сприятливі переважно люди похилого віку", d: "механізм передачі - трансмісивний" }, correct: ["a", "d"] },
    { question: "17. Зовнішній вигляд хворого при висипному тифі:", options: { a: "обличчя одутловате, бліде, світлобоязнь", b: "обличчя одутловате, гіперемійоване, судини склер ін'єковані, очі блищать, розеольозно-петехіальний висип", c: "обличчя одутловате, погляд байдужий", d: "зовнішній вигляд без змін" }, correct: ["b"] },
    { question: "18. Поведінка хворих на висипний тиф:", options: { a: "апатичний, байдужий", b: "хворий спокійний", c: "хворий неспокійний, багато говорить, дезорієнтований, можливі галюцинації", d: "хворий стогне, орієнтований" }, correct: ["c"] },
    { question: "19. Найбільш характерна температурна крива при висипному тифі на висоті захворювання:", options: { a: "ремітуюча", b: "субфебрильна", c: "постійна", d: "гектична" }, correct: ["c"] },
    { question: "20. Характер висипу при висипному тифі:", options: { a: "розеольозно-петехіальна з фестончатим краєм", b: "розеольозна, круглої форми", c: "уртикарна", d: "крупно-плямиста" }, correct: ["a"] },
    { question: "21. Строки появи висипу при висипному тифі:", options: { a: "2-3-й день хвороби", b: "4-5-й день хвороби", c: "8-10-й день хвороби", d: "12-14-й день" }, correct: ["b"] },
    { question: "22. Характер головного болю при висипному тифі:", options: { a: "біль у лобній частині", b: "біль у потиличній ділянці", c: "біль розлитий, нерізко виражений", d: "біль інтенсивний, постійний, розлитий" }, correct: ["d"] },
    { question: "23. Захворювання, при якому мають місце симптоми Кіарі-Авцина, Говорова-Годельє:", options: { a: "черевний тиф", b: "висипний тиф", c: "грип", d: "лептоспіроз" }, correct: ["b"] },
    { question: "24. Захворювання, при якому є лихоманка, різкий головний біль, безсоння, гіперемія обличчя, «кролячі очі», кон'юнктивальна енантема, ейфорія:", options: { a: "грип", b: "черевний тиф", c: "висипний тиф", d: "ГГНС" }, correct: ["c"] },
    { question: "25. Характерні ускладнення при висипному тифі:", options: { a: "стоматит, отит", b: "серцево-судинна недостатність", c: "тромбози, тромбоемболії", d: "всі перераховані" }, correct: ["a", "b", "c"] },
    { question: "26. Найефективніші препарати для лікування висипного тифу:", options: { a: "тетрациклін", b: "пеніцилін", c: "стрептоміцин", d: "сульфаніламіди" }, correct: ["a"] },
    { question: "27. При тяжкому перебігу висипного тифу висипка з'являється на:", options: { a: "обличчі", b: "шиї", c: "долонях", d: "підошвах" }, correct: ["c", "d"] },
    { question: "28. Вкажіть на правильне твердження при сепсисі:", options: { a: "найбільш частими збудниками є патогенні мікроорганізми", b: "найбільшу небезпеку становлять госпітальні штами умовно патогенних мікроорганізмів", c: "характерний циклічний перебіг хвороби", d: "клінічні прояви залежать виключно від збудника" }, correct: ["b"] },
    { question: "29. Найбільш характерним клінічним проявом сепсису є все, крім:", options: { a: "лихоманки неправильного типу", b: "ознобу, поту", c: "гепатолієнального синдрому", d: "поліаденопатії" }, correct: ["d"] },
    { question: "30. При сепсисі частіше всього спостерігається все, крім:", options: { a: "ураження органів травлення", b: "висипань на шкірі", c: "деструктивної пневмонії", d: "ураження нирок" }, correct: ["b"] },
    { question: "31. Для підтвердження діагнозу сепсису використовують всі методи, крім:", options: { a: "бактеріологічного дослідження крові", b: "знаходження антитіл проти збудника", c: "знаходження антигенів збудника (ІФА)", d: "бактеріологічного дослідження харкотиння, сечі" }, correct: ["b"] },
    { question: "32. Правильними твердженнями щодо сепсису є всі, крім:", options: { a: "викликається умовно патогенною флорою", b: "звичайно є аутоінфекцією", c: "розвивається в результаті екзогенної інфекції", d: "характеризується стійкою бактеріємією" }, correct: ["c"] },
    { question: "33. Вкажіть на правильне твердження щодо сепсису:", options: { a: "етіотропні засоби призначати після встановлення етіології", b: "доцільно застосовувати препарати широкого спектру", c: "антимікробна терапія повинна проводитись з урахуванням чутливості", d: "санація вогнища не має значення" }, correct: ["c"] },
    { question: "34. Для сепсису характерно все, крім:", options: { a: "наявності вхідних воріт", b: "стійкої бактеріємії", c: "формування вторинних вогнищ", d: "циклічного перебігу хвороби" }, correct: ["d"] },
    { question: "35. Вкажіть на неправильне твердження щодо лікування сепсису:", options: { a: "провідну роль відіграє антимікробна терапія", b: "важливе значення відіграє хірургічна санація", c: "необхідні заходи на профілактику дисбактеріозу", d: "після визначення чутливості необхідно призначати антибіотики широкого спектру" }, correct: ["d"] },
    { question: "36. Збудником кліщового енцефаліту є:", options: { a: "лістерія", b: "боррелія", c: "вірус", d: "мікоплазма" }, correct: ["c"] },
    { question: "37. Все нижче перераховане характеризує кліщовий енцефаліт, за виключенням:", options: { a: "збудником є вірус", b: "переносником є іксодові кліщі", c: "шляхи передачі — трансмісивний та аліментарний", d: "характерна осінньо-зимня сезонність" }, correct: ["d"] },
    { question: "38. Кліщовий енцефаліт розповсюджений:", options: { a: "в степових районах", b: "в південній частині лісової зони від Атлантичного до Тихого океану", c: "на всіх континентах Південної півкулі", d: "тільки в Австралії" }, correct: ["b"] },
    { question: "39. Джерелом збудника при кліщовому енцефаліті можуть бути всі, крім:", options: { a: "багатьох видів ссавців", b: "гризунів", c: "деяких видів птахів", d: "хворої людини" }, correct: ["d"] },
    { question: "40. Вкажіть на неправильне твердження щодо епідеміології кліщового енцефаліту:", options: { a: "основний резервуар — іксодові кліщі", b: "зараження можливе при втиранні фекалій кліщів в ранку", c: "збудник може знаходитись в молоці тварин", d: "має весняно-літню сезонність" }, correct: ["b"] },
    { question: "41. Для клінічної картини кліщового енцефаліту характерні такі симптоми, за виключенням:", options: { a: "загальноінтоксикаційного", b: "менінгіального", c: "енцефалітичного", d: "офтальмоплегічного" }, correct: ["d"] },
    { question: "42. До основних клінічних форм кліщового енцефаліту відноситься всі, крім:", options: { a: "кишкової", b: "лихоманочної", c: "менінгіальної", d: "менінгоенцефалополіомієлітичної" }, correct: ["a"] },
    { question: "43. Для лихоманочної форми кліщового енцефаліту характерно все, крім:", options: { a: "гострого початку", b: "короткочасної лихоманки", c: "катаральних явищ", d: "гіперемії обличчя" }, correct: ["c"] },
    { question: "44. Для менінгіальної форми кліщового енцефаліту характерно все, крім:", options: { a: "посилення головного болю на 3-4 дні", b: "приєднання блювання", c: "менінгіальних симптомів", d: "розладів свідомості" }, correct: ["d"] },
    { question: "45. Для менінгоенцефалітичної форми кліщового енцефаліту характерно все, крім:", options: { a: "поступового початку", b: "високої лихоманки", c: "розладів свідомості", d: "спастичних парезів" }, correct: ["a"] },
    { question: "46. Для менінгоенцефалітичної форми кліщового енцефаліту характерно все, за виключенням:", options: { a: "порушення свідомості", b: "судом", c: "парезів черепних нервів", d: "в'ялих парезів кінцівок" }, correct: ["d"] },
    { question: "47. Вкажіть на неправильне твердження відносно віддалених наслідків кліщового енцефаліту:", options: { a: "деменція", b: "атаксія", c: "сліпота та зниження слуху", d: "атрофічні паралічі м'язів шиї" }, correct: ["c"] },
    { question: "48. Вкажіть на правильне твердження щодо менінгоенцефаломієлітичної форми кліщового енцефаліту:", options: { a: "домінує загальномозкова симптоматика", b: "характерні в'ялі паралічі м'язів шиї", c: "характерні тазові розлади", d: "відновлення м'язів протягом року" }, correct: ["b", "c"] },
    { question: "49. Діагноз кліщового енцефаліту може бути підтверджений всім, за виключенням:", options: { a: "шкірної алергічної проби", b: "виділення вірусу з крові", c: "РЗК", d: "РПГА" }, correct: ["a"] },
    { question: "50. Диференціальний діагноз при кліщовому енцефаліті проводиться з усіма хворобами, крім:", options: { a: "грипу", b: "хвороби Лайма", c: "ботулізму", d: "поліомієліту" }, correct: ["c"] },
    { question: "51. Основним засобом лікування кліщового енцефаліту є:", options: { a: "препарати інтерферону", b: "антитоксична сироватка", c: "ацикловір", d: "імуноглобулін" }, correct: ["e"] },

    { question: "244. Мисливець, 4-й день хвороби: стан тяжкий, сопор, T 39,2°С, петехіальні висипання, симптом 'капюшона'. Назвіть ведучий механізм виникнення екзантеми?", options: { a: "Універсальний капіляротоксикоз", b: "Осідання імунних комплексів", c: "Деструктивно-проліферативний тромбоваскуліт", d: "Дефіцит факторів згортання" }, correct: ["c"] },
    { question: "245. Рибалка, T 40°С, анурія, на склерах геморагії, на долонях подряпини. Вкажіть найбільш доречну лікувальну тактику:", options: { a: "Етіотропне лікування з корекцією водно-електролітних та гемокоагуляційних порушень", b: "Призначити тільки антибіотики пеніцилінового ряду", c: "Призначити форсований діурез", d: "Призначити ентеросорбцію" }, correct: ["a"] },
    { question: "246. Хворий госпіталізований на 7-й день хвороби: різка слабкість, жовтяниця, носова кровотеча, біль у литкових м'язах, діурез 200 мл. Який найбільш вірогідний діагноз?", options: { a: "Лептоспіроз", b: "Черевний тиф", c: "Вірусний гепатит А", d: "Сепсис" }, correct: ["a"] },
    { question: "247. У хворого без певного місця проживання T 39,5°С, сильний головний біль, марення, позитивні симптоми Кіарі-Авцина. Який показник специфічної діагностики підтверджує діагноз?", options: { a: "Виявлення IgG РНІФ до рикетсій Провасека", b: "Виявлення IgG ІФА до рикетсій Провасека", c: "Виявлення IgM РНІФ до рикетсій Провасека", d: "РНГА титр 1:100" }, correct: ["b"] },
    { question: "248. У хворого протягом тижня кожні 48 годин приступи ознобу, що змінялися жаром, T 40°С. Збільшені печінка та селезінка. Найбільш ефективний метод верифікації діагнозу:", options: { a: "Мікроскопія мазка крові та товстої краплі", b: "Гемокультура", c: "Загальний аналіз крові", d: "УЗД ОЧП" }, correct: ["a"] },
    { question: "249. Мисливець, пахвинні лімфовузли зліва збільшені до 6 см, болючі, шкіра над ними червона, натягнута. Повернувся з ендемічного по чумі регіону. Вкажіть етіотропну терапію:", options: { a: "Левофлоксацин", b: "Озельтамівір", c: "Амоксиклав", d: "Стрептоміцин" }, correct: ["d"] },
    { question: "250. Хворий БОМЖ, 5-й день хвороби: T 40°С, збуджений, розеольозно-петехіальний висип, позитивний симптом Говорова-Годельє. Які сторони епіданамнезу треба з'ясувати?", options: { a: "Наявність вошей", b: "Контакт з гризунами", c: "Вживання недоброякісної їжі", d: "Контакт з інфекційними хворими" }, correct: ["a"] },
    { question: "251. Військовослужбовець з Конго, в мазках крові виявлено Pl. falciparum. Скарги на T 38,5°С, головний біль. Призначте етіотропну терапію:", options: { a: "Артеметр + Люмефантрин", b: "Примахін", c: "Делагіл", d: "Парацетамол" }, correct: ["a"] },
    { question: "252. Хворий повернувся з Індії: часті рідкі випорожнення, блювання, судоми, T 35,0°С, АТ 80/60. Вкажіть засіб для екстренної профілактики серед контактних осіб:", options: { a: "Призначення тетрацикліну на 4 дні", b: "Призначення вакцини", c: "Призначення доксицикліну одноразово", d: "Призначення анатоксину" }, correct: ["a"] },
    { question: "253. У хворого 'п'яне' обличчя, 'кролячі' очі, тремор язика, розеольозно-петехіальний висип. Діагноз: епідемічний висипний тиф. Який механізм зараження?", options: { a: "Фекально-оральний", b: "Повітряно-краплинний", c: "Контактно-побутовий", d: "Трансмісивний" }, correct: ["d"] }
    
        ];

        let currentQ = 0;
        let score = 0;
        let errors = [];
        let isAnswered = false;
        let userSelect = [];

        function loadQ() {
            isAnswered = false;
            userSelect = [];
            document.getElementById('feedback-container').style.display = 'none';
            document.getElementById('main-btn').innerText = "Перевірити";
            document.getElementById('main-btn').disabled = true;
            
            const q = quizData[currentQ];
            document.getElementById('question-counter').innerText = `Питання ${currentQ + 1} з ${quizData.length}`;
            document.getElementById('question-text').innerText = q.question;
            
            const container = document.getElementById('options-container');
            container.innerHTML = '';
            
            const type = q.correct.length > 1 ? 'checkbox' : 'radio';
            
            for (let key in q.options) {
                const item = document.createElement('div');
                item.className = 'option-item';
                item.innerHTML = `
                    <input type="${type}" id="${key}" name="opt">
                    <label>${key}) ${q.options[key]}</label>
                `;
                item.onclick = () => selectOpt(item, key, type);
                container.appendChild(item);
            }
        }

        function selectOpt(item, key, type) {
            if (isAnswered) return;
            if (type === 'radio') {
                userSelect = [key];
                document.querySelectorAll('.option-item').forEach(el => el.classList.remove('selected'));
                item.classList.add('selected');
                document.querySelectorAll('input').forEach(i => i.checked = false);
                item.querySelector('input').checked = true;
            } else {
                if (userSelect.includes(key)) {
                    userSelect = userSelect.filter(k => k !== key);
                    item.classList.remove('selected');
                    item.querySelector('input').checked = false;
                } else {
                    userSelect.push(key);
                    item.classList.add('selected');
                    item.querySelector('input').checked = true;
                }
            }
            document.getElementById('main-btn').disabled = userSelect.length === 0;
        }

        function handleButtonClick() {
            if (!isAnswered) check();
            else next();
        }

        function check() {
            isAnswered = true;
            const q = quizData[currentQ];
            const isCorrect = userSelect.sort().join() === q.correct.sort().join();
            
            const feedback = document.getElementById('feedback-container');
            feedback.style.display = 'block';
            
            if (isCorrect) {
                score++;
                feedback.innerHTML = '<span class="res-correct">Правильно!</span>';
            } else {
                feedback.innerHTML = '<span class="res-wrong">Неправильно.</span>';
                errors.push({
                    q: q.question,
                    user: userSelect.map(k => `${k}) ${q.options[k]}`).join(', '),
                    correct: q.correct.map(k => `${k}) ${q.options[k]}`).join(', ')
                });
            }
            
            document.querySelectorAll('.option-item').forEach(el => {
                const val = el.querySelector('input').id;
                if (q.correct.includes(val)) el.classList.add('correct');
                else if (userSelect.includes(val)) el.classList.add('incorrect');
            });
            
            document.getElementById('main-btn').innerText = (currentQ < quizData.length - 1) ? "Наступне" : "Завершити";
        }

        function next() {
            currentQ++;
            if (currentQ < quizData.length) loadQ();
            else showResult();
        }

        function showResult() {
            document.getElementById('quiz-container').style.display = 'none';
            document.getElementById('result-container').style.display = 'block';
            document.getElementById('score-text').innerHTML = `<h3>Ваш рахунок: ${score} з ${quizData.length}</h3>`;
            
            const review = document.getElementById('error-review');
            if (errors.length > 0) {
                review.innerHTML = '<h4>Огляд помилок:</h4>';
                errors.forEach(err => {
                    review.innerHTML += `
                        <div class="result-item">
                            <p><strong>${err.q}</strong></p>
                            <p class="res-wrong">Ви: ${err.user || 'нічого'}</p>
                            <p class="res-correct">Правильно: ${err.correct}</p>
                        </div>
                    `;
                });
            }
        }
        loadQ();
    </script>
