<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тестування: Інфекції з трансмісивним механізмом передачі</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f0f2f5;
            color: #1c1e21;
            margin: 0;
            padding: 10px;
            display: flex;
            justify-content: center;
            align-items: center; 
            min-height: 100vh;
        }

        #quiz-container, #result-container {
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 650px;
            min-height: 300px;
            display: flex;
            flex-direction: column;
        }

        #quiz-header { padding: 20px; background-color: #007bff; color: white; border-radius: 12px 12px 0 0; }
        #question-counter { font-size: 0.85em; opacity: 0.9; margin-bottom: 4px; }
        #question-text { font-size: 1.15em; font-weight: 600; line-height: 1.4; }

        #options-container { 
            padding: 20px; 
            display: flex; 
            flex-direction: column; 
            gap: 12px;
            flex-grow: 1;
        }

        .option-item {
            display: flex;
            align-items: center;
            border: 2px solid #e4e6eb;
            border-radius: 10px;
            padding: 14px;
            cursor: pointer;
            transition: all 0.1s ease;
            -webkit-tap-highlight-color: transparent;
        }

        .option-item:active { transform: scale(0.98); background-color: #f0f2f5; }
        .option-item.selected { border-color: #007bff; background-color: #e7f3ff; }
        .option-item.correct { border-color: #28a745; background-color: #d4edda; color: #155724; }
        .option-item.incorrect { border-color: #dc3545; background-color: #f8d7da; color: #721c24; }

        .option-item input { width: 20px; height: 20px; margin-right: 15px; flex-shrink: 0; pointer-events: none; }
        .option-item label { flex-grow: 1; cursor: pointer; font-size: 1em; pointer-events: none; }

        #navigation {
            padding: 15px 20px;
            background-color: #f8f9fa;
            border-top: 1px solid #e4e6eb;
            display: flex;
            justify-content: flex-end;
            border-radius: 0 0 12px 12px;
        }

        .nav-button {
            padding: 12px 24px;
            border-radius: 8px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            background-color: #007bff;
            color: white;
            transition: background-color 0.2s;
        }

        .nav-button:hover { background-color: #0056b3; }
        .nav-button:disabled { background-color: #bcc0c4; cursor: not-allowed; }
        #feedback-container { padding: 10px 20px; text-align: center; font-weight: bold; display: none; }
        .res-correct { color: #28a745; }
        .res-wrong { color: #dc3545; }
        .result-item { padding: 15px; border-bottom: 1px solid #eee; }
        #result-container { display: none; padding: 20px; max-height: 90vh; overflow-y: auto; }
    </style>
</head>
<body>

    <div id="quiz-container">
        <div id="quiz-header">
            <div id="question-counter"></div>
            <div id="question-text"></div>
        </div>
        <div id="options-container"></div>
        <div id="feedback-container"></div>
        <div id="navigation">
            <button class="nav-button" id="main-btn" onclick="handleButtonClick()" disabled>Перевірити</button>
        </div>
    </div>

    <div id="result-container">
        <h2>Результат</h2>
        <div id="score-text"></div>
        <div id="error-review"></div>
        <button class="nav-button" onclick="location.reload()" style="width:100%; margin-top:20px;">Почати знову</button>
    </div>

    <script>
        // ТУТ ЗБЕРІГАЮТЬСЯ ВСІ ПИТАННЯ (Поки що перші 30)

            { question: "3. Малярія, що має найбільш важкий перебіг:", options: { a: "триденна", b: "тропічна", c: "овале", d: "чотириденна" }, correct: ["b"] },
            { question: "4. Приступи малярії спостерігаються в різні години доби при:", options: { a: "триденній", b: "овале", c: "тропічній", d: "чотириденній" }, correct: ["c"] },
            { question: "5. Які дослідження використовують для підтвердження діагнозу малярії:", options: { a: "загальний аналіз крові", b: "мазки крові, товста крапля крові", c: "серологічні методи", d: "біологічні методи" }, correct: ["b"] },

            { question: "7. Малярія, при якій можна досліджувати кров, не дочекавшись пароксизму:", options: { a: "тропічна", b: "овале", c: "триденна", d: "чотириденна" }, correct: ["a"] },
            { question: "8. Малярія, для якої найбільш характерний розвиток ускладнень:", options: { a: "овале", b: "триденна", c: "чотириденна", d: "тропічна" }, correct: ["d"] },
            { question: "9. Ускладнення, не характерне для тропічної малярії:", options: { a: "алгід", b: "малярійна кома", c: "гемоглобінурійна лихоманка", d: "нефротичний синдром", e: "дегідратаційний шок" }, correct: ["e"] },
            { question: "14. Не використовуються для індивідуальної хіміопрофілактики малярії:", options: { a: "делагіл", b: "фансідар", c: "амодіахін", d: "тетрациклін" }, correct: ["d"] },

            { question: "17. Зовнішній вигляд хворого при висипному тифі:", options: { a: "обличчя одутловате, бліде, світлобоязнь, нежить", b: "обличчя одутловате, гіперемійоване, судини склер ін'єковані, очі блищать, хворий неспокійний, на тулубі - розеольозно-петехіальний висип", c: "обличчя одутловате, погляд затьмарений, байдужий", d: "зовнішній вигляд без змін" }, correct: ["b"] },

            { question: "24. Захворювання, при якому є лихоманка, різкий головний біль, безсоння, гіперемія та одутловатісь обличчя, «кролячі очі», кон'юнктивальна енантема, ейфорія:", options: { a: "грип", b: "черевний тиф", c: "висипний тиф", d: "геморагічна лихоманка з нирковим синдромом" }, correct: ["c"] },
            { question: "25. Найефективніші препарати для лікування висипного тифу:", options: { a: "тетрациклін", b: "пеніцилін", c: "стрептоміцин", d: "сульфаніламіди" }, correct: ["a"] },
            { question: "451. Збудник хвороби Брілла:", options: { a: "Rickettsia typhi", b: "Borrelia recurrentis", c: "Coxiella burnetii", d: "Rickettsia prowazekii" }, correct: ["d"] },

            { question: "32. Правильними твердженнями щодо сепсису є всі, крім:", options: { a: "зазвичай викликається умовно патогенною флорою", b: "звичайно є аутоінфекцією", c: "розвивається, як правило, в результаті екзогенної інфекції", d: "розвивається у осіб з порушеними захисними механізмами", e: "характеризується стійкою бактеріємією" }, correct: ["c"] },
            { question: "33. Вкажіть на правильне твердження щодо сепсису:", options: { a: "етіотропні засоби необхідно призначати після встановлення етіології", b: "при встановленні етіології доцільно застосовувати препарати широкого спектру", c: "антимікробна терапія повинна проводитись з урахуванням чутливості збудника", d: "санація первинного вогнища не має суттєвого значення", e: "при відсутності ефекту протягом 2-х діб необхідно замінити антибіотики" }, correct: ["c"] },

            { question: "258. Хворий 42 років мисливець... На тулубі та кінцівках рясні петехіальні висипання. Симптом \"капюшона\"... Назвіть ведучий механізм виникнення екзантеми?", options: { a: "Дефіцит факторів згортання крові", b: "Осідання імунних комплексів у капілярах", c: "Капіляротоксикоз", d: "Деструктивно-проліферативний тромбоваскуліт", e: "Попадання збудника у лімфатичні судини" }, correct: ["d"] },
            { question: "259. Хворий С., 39 років... червона пляма розміром до 6-7см, що збільшувалась... яскраву кільцеподібну еритему з чіткими краями та зоною просвітлення в центрі. Вірогідний діагноз:", options: { a: "Лайм-бореліоз", b: "Бешиха лівої гомілки", c: "Еризипелоїд", d: "Сибірська виразка", e: "Алергічний дерматит" }, correct: ["a"] },
            { question: "262. Хлопчик 12 років... мав місце укус кліща 2 міс тому... проти боррелії IgM 1,79, IgG 7,05. Діагноз:", options: { a: "Ювенільний ідіопатичний артрит", b: "Ревматоїдний артрит", c: "Ревматизм", d: "Лайм-артрит", e: "Коксит" }, correct: ["d"] },
            { question: "263. У хворого 28 років, без постійного місця проживання... розеольозно-петехіальний висип... ейфорія, почервоніння склер, тремор язика. Імовірний діагноз?", options: { a: "Висипний тиф", b: "Лептоспіроз", c: "Черевний тиф", d: "Алкогольний делірій", e: "Кір" }, correct: ["a"] },

            { question: "272. 43-річний чоловік без постійного місця проживання... На одязі велика кількість вошей... Язик при висовуванні тремтить та відхиляється. Імовірний діагноз?", options: { a: "Черевний тиф", b: "Аденовірусна інфекція", c: "Висипний тиф", d: "Інфекційний мононуклеоз", e: "Грип" }, correct: ["c"] },
            { question: "274. Хвора 42-х років... Напади лихоманки продовжувався 6 годин... повторювалися кожен 3-й день. Гепатолієнальний синдром. Найбільш інформативний метод діагностики?", options: { a: "Мазок та товста крапля крові", b: "Бакпосів сечі", c: "Реакція Відаля", d: "Печінкові проби", e: "Посів крові на стерильність" }, correct: ["a"] },
            { question: "275. Хворий напередодні відчув легке нездужання... вираженим болем при рухах очних яблук. На м'якому піднебінні зерниста енантема... Який найбільш імовірний діагноз?", options: { a: "Грип", b: "Висипний тиф", c: "Черевний тиф", d: "Гарячка Ку", e: "Ентеровірусна інфекція" }, correct: ["a"] },
            { question: "278. Хворий 39-ти років... розеольознопетехіальний висип... РЗК з рикетсіями Провачека 1:640. Який найбільш імовірний діагноз?", options: { a: "Ентеровірусна інфекція", b: "Хвороба Брілла", c: "Висипний тиф", d: "Черевний тиф", e: "Грип" }, correct: ["c"] },
            { question: "279. Хворого 29-ти років госпіталізовано... На шкірі живота поодинока розеольозна висипка. Живіт здутий, збільшені печінка, селезінка. Яке захворювання можна припустити?", options: { a: "Черевний тиф", b: "Висипний тиф", c: "Лептоспіроз", d: "Грип", e: "Ієрсиніоз" }, correct: ["a"] },
            { question: "280. Хворого 35-ти років госпіталізовано з нападами лихоманки... повторювалися кожний 4-й день... Яке дослідження дозволить верифікувати діагноз?", options: { a: "Визначення рівня білірубіну", b: "Мікроскопія товстої краплі та мазку крові на малярійний плазмодій", c: "Серологічне дослідження крові", d: "Дослідження активності АлАТ і АсАТ", e: "Біохімічний аналіз крові" }, correct: ["b"] },
            { question: "281. У 31-річного хворого з'явився різкий озноб... Рік тому повернувся з Південної Азії, де було декілька нападів гарячки. Яке дослідження провести?", options: { a: "Дослідження товстої краплі крові на малярію", b: "Дослідження крові на стерильність", c: "Бактеріоскопія товстої краплі крові на менінгокок", d: "Дослідження крові на anti-HEV IgM", e: "Бактеріоскопія товстої краплі крові на лептоспіроз" }, correct: ["a"] },
            { question: "284. Хворий 53-х років... 5 днів тому розкритий карбункул спини. При бактеріологічному обстеженні крові виділений гемолітичний стрептокок. Найбільш імовірний діагноз?", options: { a: "Сепсис", b: "Карбункул спини в стадії абцедування", c: "Токсикорезорбтивна гарячка", d: "Синдром системної запальної відповіді", e: "Септичний шок" }, correct: ["a"] },
            { question: "285. Хворий 42-х років... язик збільшений, висувається поштовхоподібно, петехіальна висипка... Немає постійного місця проживання. Найбільш імовірний діагноз?", options: { a: "Висипний тиф", b: "ВІЛ-інфекція", c: "Грип", d: "Лептоспіроз", e: "Черевний тиф" }, correct: ["a"] },
            { question: "288. Хвора 37 р., циганка... виявлені воші. Крововиливи в кон'юнктиви. На шкірі розеольозно-петехіальний висип... Про яке захворювання можна подумати?", options: { a: "Висипний тиф.", b: "Черевний тиф.", c: "Менінгококцемія.", d: "Лептоспіроз.", e: "Грип." }, correct: ["a"] },
            { question: "296. У хворого 42 років, протягом тижня кожні 48 годин з'являлися приступи пропасниці... Збільшені печінка і селезінка. Найбільш ефективний метод верифікації діагнозу?", options: { a: "Мікроскопія мазка крові і товстої краплі", b: "Імуноферментний аналіз", c: "Бактеріологічний метод", d: "Загальний аналіз крові", e: "Мікроскопія висячої краплі крові" }, correct: ["a"] },
            { question: "299. У хворого з діагнозом тропічна малярія на 2-й день лікування хініном... Сеча кольору чорного пива... Визначте вид ускладнення:", options: { a: "Кровотеча", b: "Малярійна кома", c: "Гострий нефрозо нефрит", d: "Гострий гемоліз", e: "Гемоглобінурійна гарячка" }, correct: ["e"] },
            { question: "303. Хворий 48 років, ветеринарний лікар... пітливість, біль в великих суглобах... Яке дослідження доцільно провести для підтвердження діагнозу?", options: { a: "Гемокультура", b: "Реакції Райта та Хаддельсона", c: "Люмінесцентну мікроскопію мазків крові", d: "Ревматичні проби", e: "РА з рикетсіями Провачека" }, correct: ["b"] },
            { question: "304. В стаціонар на 3-й день хвороби поступив хворий 25 років... Повернувся з Африки 6 днів тому, був у джунглях. Склери субіктерічні. Яке захворювання необхідно запідозрити?", options: { a: "Жовта гарячка", b: "Лептоспіроз", c: "Грип", d: "Малярія", e: "Черевний тиф" }, correct: ["a"] },
            { question: "308. Хвороба почалася гостро... Через 3 год. температура знову з ознобом піднялась... 12 днів тому повернувся з відрядження з Центральної Африки.", options: { a: "Триденна малярія", b: "Менінгоенцефаліт, мозкова кома.", c: "Тропічна малярія", d: "Черевний тиф", e: "Лептоспіроз" }, correct: ["c"] },
            { question: "310. Лісоруб, 30 р., звернувся до лікаря... Вказує на укуси кліщів... в'ялі парези рук, які поширюються на шию... Про яке захворювання слід думати?", options: { a: "Малярія", b: "Кліщовий енцефаліт", c: "Поліомієліт", d: "Правець", e: "Сказ" }, correct: ["b"] }
            
            
        ];

        let currentQ = 0;
        let score = 0;
        let errors = [];
        let isAnswered = false;
        let userSelect = [];

        function loadQ() {
            isAnswered = false;
            userSelect = [];
            document.getElementById('feedback-container').style.display = 'none';
            document.getElementById('main-btn').innerText = "Перевірити";
            document.getElementById('main-btn').disabled = true;
            
            const q = quizData[currentQ];
            document.getElementById('question-counter').innerText = `Питання ${currentQ + 1} з ${quizData.length}`;
            document.getElementById('question-text').innerText = q.question;
            
            const container = document.getElementById('options-container');
            container.innerHTML = '';
            
            const type = q.correct.length > 1 ? 'checkbox' : 'radio';
            
            for (let key in q.options) {
                const item = document.createElement('div');
                item.className = 'option-item';
                item.innerHTML = `
                    <input type="${type}" id="${key}" name="opt">
                    <label>${key}) ${q.options[key]}</label>
                `;
                item.onclick = () => selectOpt(item, key, type);
                container.appendChild(item);
            }
        }

        function selectOpt(item, key, type) {
            if (isAnswered) return;
            if (type === 'radio') {
                userSelect = [key];
                document.querySelectorAll('.option-item').forEach(el => el.classList.remove('selected'));
                item.classList.add('selected');
                document.querySelectorAll('input').forEach(i => i.checked = false);
                item.querySelector('input').checked = true;
            } else {
                if (userSelect.includes(key)) {
                    userSelect = userSelect.filter(k => k !== key);
                    item.classList.remove('selected');
                    item.querySelector('input').checked = false;
                } else {
                    userSelect.push(key);
                    item.classList.add('selected');
                    item.querySelector('input').checked = true;
                }
            }
            document.getElementById('main-btn').disabled = userSelect.length === 0;
        }

        function handleButtonClick() {
            if (!isAnswered) check();
            else next();
        }

        function check() {
            isAnswered = true;
            const q = quizData[currentQ];
            const isCorrect = userSelect.sort().join() === q.correct.sort().join();
            
            const feedback = document.getElementById('feedback-container');
            feedback.style.display = 'block';
            
            if (isCorrect) {
                score++;
                feedback.innerHTML = '<span class="res-correct">Правильно!</span>';
            } else {
                feedback.innerHTML = '<span class="res-wrong">Неправильно.</span>';
                errors.push({
                    q: q.question,
                    user: userSelect.map(k => `${k}) ${q.options[k]}`).join(', '),
                    correct: q.correct.map(k => `${k}) ${q.options[k]}`).join(', ')
                });
            }
            
            document.querySelectorAll('.option-item').forEach(el => {
                const val = el.querySelector('input').id;
                if (q.correct.includes(val)) el.classList.add('correct');
                else if (userSelect.includes(val)) el.classList.add('incorrect');
            });
            
            document.getElementById('main-btn').innerText = (currentQ < quizData.length - 1) ? "Наступне" : "Завершити";
        }

        function next() {
            currentQ++;
            if (currentQ < quizData.length) loadQ();
            else showResult();
        }

        function showResult() {
            document.getElementById('quiz-container').style.display = 'none';
            document.getElementById('result-container').style.display = 'block';
            document.getElementById('score-text').innerHTML = `<h3>Ваш рахунок: ${score} з ${quizData.length}</h3>`;
            
            const review = document.getElementById('error-review');
            if (errors.length > 0) {
                review.innerHTML = '<h4>Огляд помилок:</h4>';
                errors.forEach(err => {
                    review.innerHTML += `
                        <div class="result-item">
                            <p><strong>${err.q}</strong></p>
                            <p class="res-wrong">Ви: ${err.user || 'нічого'}</p>
                            <p class="res-correct">Правильно: ${err.correct}</p>
                        </div>
                    `;
                });
            }
        }
        loadQ();
    </script>
